[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "S",   # bandit security checks
  "B",   # bugbear
  "W",   # warnings
]
ignore = [
  "S101",  # assert statements (used in tests)
  "S311",  # Standard pseudo-random generators (used for jitter; flagged but intentional)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "S105",  # hardcoded password strings are expected in test fixtures
  "S106",  # hardcoded password function arguments are expected in tests
  "S107",  # hardcoded password default arguments are expected in tests
]
